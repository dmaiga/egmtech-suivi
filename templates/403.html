{% extends "base.html" %}

{% block title %}Accès refusé{% endblock %}

{% block content %}
<div class="max-w-md w-full bg-white border border-gray-200 rounded-xl shadow-sm p-8 text-center mx-auto my-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-red-50 text-red-600 mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z" />
        </svg>
    </div>
    <span class="inline-block text-xs font-semibold tracking-wide uppercase px-2.5 py-0.5 rounded-full bg-red-50 text-red-700">Erreur 403</span>
    <h1 class="mt-3 text-2xl font-bold text-gray-900">Accès refusé</h1>
    <p class="mt-2 text-sm text-gray-600">Vous n'avez pas les droits nécessaires pour accéder à cette page.</p>
    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
            Retour à la connexion
        </a>
    </div>
</div>
{% endblock %}
