<div>
    <label class="block text-sm font-medium text-gray-700">Site</label>
    <select name="site" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        <option value="">—</option>
        {% for site in sites %}
        <option value="{{ site.pk }}">{{ site.nom }}</option>
        {% endfor %}
    </select>
</div>
<div>
    <label class="block text-sm font-medium text-gray-700">Formulaire attaché</label>
    <select name="attached_form" class="w-full border border-gray-300 rounded-md px-3 py-2 text-sm">
        <option value="">—</option>
        {% for attached_form in attached_forms %}
        <option value="{{ attached_form.pk }}">{{ attached_form.nom }}</option>
        {% endfor %}
    </select>
</div>
