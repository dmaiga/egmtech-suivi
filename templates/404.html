{% extends "base.html" %}

{% block title %}Page non trouvée (404){% endblock %}

{% block content %}
<div class="max-w-md w-full bg-white border border-gray-200 rounded-xl shadow-sm p-8 text-center mx-auto my-8">
    <div class="inline-flex items-center justify-center w-14 h-14 rounded-full bg-indigo-50 text-indigo-600 mb-4">
        <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
        </svg>
    </div>
    <span class="inline-block text-xs font-semibold tracking-wide uppercase px-2.5 py-0.5 rounded-full bg-indigo-50 text-indigo-700">Erreur 404</span>
    <h1 class="mt-3 text-2xl font-bold text-gray-900">Page non trouvée</h1>
    <p class="mt-2 text-sm text-gray-600">La page que vous recherchez n'existe pas ou a été déplacée.</p>
    <div class="mt-6">
        <a href="{% url 'accounts:login' %}" class="inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-lg text-white bg-indigo-600 hover:bg-indigo-700 shadow-sm transition">
            Retour à la connexion
        </a>
    </div>
</div>
{% endblock %}
