{% extends "base.html" %}

{% block title %}Importer un formulaire{% endblock %}

{% block content %}
<div class="max-w-2xl w-full space-y-6">
    <div class="flex items-center justify-between">
        <div>
            <h1 class="text-2xl font-semibold text-gray-900">Importer un formulaire (JSON)</h1>
            <p class="text-sm text-gray-500">
                Solution de secours. Pour la plupart des cas, utilisez plutôt
                <a href="{% url 'forms_cms:builder-new' %}" class="text-indigo-600 hover:underline">l'éditeur</a>.
            </p>
        </div>
        <a href="{% url 'forms_cms:list' %}" class="text-indigo-600 hover:underline text-sm">Retour à la liste</a>
    </div>

    <section class="bg-white border border-gray-200 rounded-lg p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">
                Importer
            </button>
        </form>
    </section>
</div>
{% endblock %}
