{% extends "base.html" %}

{% block title %}Importer un formulaire{% endblock %}

{% block content %}
<div class="max-w-2xl w-full space-y-6">
    <div class="flex items-center justify-between">
        <h1 class="text-2xl font-semibold text-gray-900">Importer un formulaire</h1>
        <a href="{% url 'forms_cms:list' %}" class="text-indigo-600 hover:underline text-sm">Retour à la liste</a>
    </div>

    <section class="bg-white border border-gray-200 rounded-lg p-6">
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit" class="bg-indigo-600 text-white px-4 py-2 rounded-md text-sm font-medium hover:bg-indigo-700">
                Importer
            </button>
        </form>
    </section>
</div>
{% endblock %}
