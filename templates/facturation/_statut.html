{% comment %}Badge du statut d'un document, suivi du badge « Expiré » calculé : {% include "facturation/_statut.html" with document=document %}{% endcomment %}
{% with s=document.statut %}<span class="badge {% if s == 'accepte' or s == 'payee' %}badge-success{% elif s == 'envoye' or s == 'emise' %}badge-info{% elif s == 'refuse' %}badge-danger{% elif s == 'annulee' %}badge-warning{% else %}badge-neutral{% endif %}">{{ document.get_statut_display }}</span>{% endwith %}{% if document.est_expire %} <span class="badge badge-warning">Expiré</span>{% endif %}
