# MariaDB locale pour le développement et les tests (voir README, « Environnement de développement »).
# Version et collation alignées sur la prod supposée (MariaDB 11.4, utf8mb4), à confirmer.
# Aucun secret ici : les identifiants viennent du fichier .env (ignoré par git).
name: egmtech-suivi-terrain

services:
  mariadb:
    image: mariadb:11.4
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MARIADB_ROOT_PASSWORD: ${MARIADB_ROOT_PASSWORD:?à définir dans .env}
      MARIADB_DATABASE: ${DB_NAME:?à définir dans .env}
      MARIADB_USER: ${DB_USER:?à définir dans .env}
      MARIADB_PASSWORD: ${DB_PASSWORD:?à définir dans .env}
    ports:
      # Publié sur la boucle locale uniquement. 3306 par défaut ; mettre DB_PORT=3307 dans .env
      # si le port 3306 est déjà pris sur le Mac.
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
      - ./docker/mariadb/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  mariadb_data:
